[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuratal-transformer"
version = "1.4.0"
description = "Neuratal NTransformer: an independently developed, PyTorch-based, decoder-only Transformer architecture and training framework (GQA, RoPE, SwiGLU, KV cache, NTokenizer v0.3-polished compatible)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Neuratal Transformer Contributors" }]
keywords = ["transformer", "pytorch", "llm", "language-model", "decoder-only", "neural-network", "deep-learning", "tokenizer", "gqa", "rope", "swiglu", "kv-cache", "machine-learning", "neuratal", "ntransformer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/Neuratal/NTransformer"
Documentation = "https://github.com/Neuratal/NTransformer/tree/master/docs"
Issues = "https://github.com/Neuratal/NTransformer/issues"
Repository = "https://github.com/Neuratal/NTransformer"

[tool.setuptools.packages.find]
include = ["neuratal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
