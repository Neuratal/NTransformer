# Minimal CI for NTransformer: CPU-only test gate.
# CUDA-specific tests skip automatically where no GPU is present; the
# NTokenizer integration suite skips unless the sibling artifact exists
# (it is not in this repository), which is the documented behavior.
name: tests
on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .[dev]
      - name: Run test suite
        run: python -m pytest tests -q
